
name: DentalPM P0 - Validation

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Compilation frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dental-pm-mvp/frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dental-pm-mvp/frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci --include=dev

      - name: Vérifier les dates Madagascar
        run: |
          node --input-type=module -e "
          import { clinicDateISO, shiftCivilDays } from './src/utils/clinicDate.mjs';
          if (clinicDateISO(new Date('2026-11-05T22:30:00Z')) !== '2026-11-06') process.exit(1);
          if (shiftCivilDays('2026-11-06', -1) !== '2026-11-05') process.exit(1);
          "

      - name: Compiler DentalPM
        run: npm run build

  backend:
    name: Vérification backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dental-pm-mvp

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dental-pm-mvp/package-lock.json

      - name: Installer les dépendances
        run: npm ci --include=dev

      - name: Vérifier la syntaxe serveur
        run: |
          node --check server.js
          node --check routes/dental-chart.js
          node --check routes/odontogram.js

     
      - name: Exécuter les tests backend avec diagnostic
        timeout-minutes: 5
        run: |
          timeout --signal=TERM --kill-after=15s 240s \
            npm test -- \
            --runInBand \
            --detectOpenHandles \
            --testTimeout=15000 \
            --verbose

  clinical_postgres:
    name: Intégrité clinique PostgreSQL (base isolée)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinical_test
          POSTGRES_PASSWORD: temporary_ci_only
          POSTGRES_DB: dentalpm_clinical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinical_test -d dentalpm_clinical_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: dental-pm-mvp
    env:
      CI: "true"
      NODE_ENV: test
      DENTALPM_PG_TESTS: "1"
      DATABASE_URL: postgres://clinical_test:temporary_ci_only@127.0.0.1:5432/dentalpm_clinical_test
      DB_SSL: "false"
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dental-pm-mvp/package-lock.json

      - name: Installer les dépendances
        run: npm ci --include=dev

      - name: Vérifier les transactions sur PostgreSQL jetable
        timeout-minutes: 5
        run: npm test -- --runInBand --detectOpenHandles --testTimeout=15000 --runTestsByPath __tests__/clinicalPostgres.integration.test.js --verbose
